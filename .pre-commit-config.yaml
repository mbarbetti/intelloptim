# Hooks for local use: `pre-commit install`. The formatters and the type checker
# are the ones installed with the `dev` extra (`language: system`), so the
# versions and the dependencies are the same as in `nox` and in CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: debug-statements

  - repo: local
    hooks:
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy src/intelloptim
        language: system
        pass_filenames: false
        files: ^src/intelloptim/
