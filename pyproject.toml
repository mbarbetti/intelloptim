[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "intelloptim"
dynamic = ["version"]
description = "Distributed black-box optimization on Optuna's ask/tell API, with classical and quantum samplers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [
    { name = "Matteo Barbetti", email = "matteo.barbetti.94@gmail.com" },
]
keywords = [
    "optimization",
    "black-box",
    "hyperparameter",
    "optuna",
    "bayesian",
    "quantum",
    "distributed",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Quantum Computing",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Base install: everything needed to write an objective and run a study.
#   pydantic  spec and wire models
#   optuna    the algorithm layer builds Optuna samplers and pruners
#   numpy     the built-in and quantum samplers
#   httpx     REST/WS client
#   click     the `intelloptim-worker` command
dependencies = [
    "pydantic>=2.6,<3",
    "optuna>=4.0",
    "numpy>=1.24",
    "httpx>=0.27",
    "click>=8.1",
]

[project.optional-dependencies]
# Optional runtime packages of samplers. They are checked when a sampler is
# resolved (see `algorithms/samplers.py`), which raises an error naming the
# extra to install if one is missing.
gp = [
    "torch>=2.1",
    "scipy>=1.10",
]
qmc = [
    "scipy>=1.10",
]
# Quantum policy samplers: `quantum` simulates with Qiskit; `quantum-ibm` adds
# access to IBM hardware.
quantum = [
    "qiskit>=1.2",
]
quantum-ibm = [
    "intelloptim[quantum]",
    "qiskit-ibm-runtime>=0.30",
]
# What the server image installs. IBM hardware access stays opt-in, so
# `quantum-ibm` is not included.
samplers = [
    "intelloptim[gp,qmc,quantum]",
]
# Tests, linting and type checking.
dev = [
    "intelloptim[quantum]",
    "intelloptim[docs]",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "respx>=0.21",
    "ruff>=0.17,<0.18",
    "black>=26.10,<27",
    "mypy>=2.4,<3",
    "pre-commit>=4.0",
    "nox>=2024.10",
    "build>=1.2",
    "twine>=5.1",
]
docs = [
    "sphinx>=8.2,<9",
    "furo>=2024.8.6",
]

[project.scripts]
intelloptim-worker = "intelloptim.worker.cli:main"

[project.urls]
Homepage = "https://github.com/mbarbetti/intelloptim"
Repository = "https://github.com/mbarbetti/intelloptim"
Issues = "https://github.com/mbarbetti/intelloptim/issues"
Changelog = "https://github.com/mbarbetti/intelloptim/blob/main/CHANGELOG.md"
"Hopaas paper" = "https://arxiv.org/abs/2301.05522"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["intelloptim*"]

[tool.setuptools.package-data]
intelloptim = ["py.typed"]

# The version comes from the git tag (v0.1.0 -> 0.1.0). The fallback is used when
# the package is built without git metadata, for example from a plain copy of
# the sources inside a Docker build.
[tool.setuptools_scm]
fallback_version = "0.0.0+unknown"

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313", "py314", "py315"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Pyupgrade rules (UP) are deliberately omitted: per the project owner's
# preference, code uses the explicit `typing.List/Dict/Optional/Union`
# style rather than the PEP 585 / PEP 604 builtins-and-pipes form.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "SIM", # simplify
]
ignore = [
    "E501", # handled by black
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# Integration tests import the SDK under test after `pytest.importorskip`.
"tests/integration/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["optuna.*", "respx.*", "qiskit.*", "qiskit_ibm_runtime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
testpaths = ["tests"]
markers = [
    "qiskit: integration test that runs the real Qiskit SDK (needs the `quantum` extra)",
    "hardware: opt-in test on a real quantum device; skipped unless explicitly enabled",
]

[tool.coverage.run]
source = ["src/intelloptim"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
